spring.application.name=switch-pagos
server.port=${SERVER_PORT:8081}
spring.profiles.default=local

# PostgreSQL (obligatorio por variables de entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:switch_pagos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=true

# Parametros de negocio por entorno
# Hora de corte para ingesta inmediata (0-23)
app.ingest.cutoff-hour=${APP_INGEST_CUTOFF_HOUR:18}
# Ventana para detectar duplicados de archivo en dias
app.validation.duplicate-window-days=${APP_VALIDATION_DUPLICATE_WINDOW_DAYS:30}

# Control de autocreacion de BD (recomendado solo local)
app.db.auto-create=${APP_DB_AUTO_CREATE:false}
