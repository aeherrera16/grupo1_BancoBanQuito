# Perfil local: crea la base si no existe y facilita desarrollo
app.db.auto-create=true
spring.jpa.hibernate.ddl-auto=update

# Base de datos H2 para desarrollo
spring.datasource.url=jdbc:h2:mem:banquito_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de horario de corte
horario.corte=18:00

# Validación de clientes (true = valida contra base de datos, false = siempre true)
app.validation.customer-service.enabled=false

# Configuración de procesadores (eliminados - usa buzón SFTP)
# app.local-processor.* - movido al servicio switch-email-service
# app.email-processor.* - movido al servicio switch-email-service
