server.port=8081
# Perfil local: crea la base si no existe y facilita desarrollo
app.db.auto-create=true
spring.jpa.hibernate.ddl-auto=update

# Configuración de horario de corte
horario.corte=18:00

# Validación de clientes (true = valida contra base de datos, false = siempre true)
app.validation.customer-service.enabled=false

# Configuración del procesador local para pruebas SFTP (estructura organizada)
app.local-processor.enabled=true
app.local-processor.input-dir=sftp-files/pagos
app.local-processor.processed-dir=sftp-files/procesados
app.local-processor.error-dir=sftp-files/errores

# Core bancario para ejecutar debitos y creditos de pagos masivos
app.core.base-url=http://localhost:8080

# Configuración del servidor SFTP para pruebas locales
app.sftp.host=${SFTP_HOST:localhost}
app.sftp.port=${SFTP_PORT:2222}
app.sftp.username=${SFTP_USERNAME:sftpuser}
app.sftp.password=${SFTP_PASSWORD:sftppass}
app.sftp.remote-dir=${SFTP_REMOTE_DIR:/upload/pagos}
app.sftp.processed-dir=${SFTP_PROCESSED_DIR:/upload/procesados}
app.sftp.error-dir=${SFTP_ERROR_DIR:/upload/errores}
